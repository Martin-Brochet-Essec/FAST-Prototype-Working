<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAST — Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="device">
  <div class="langswitch">
    <button class="langbtn" data-lang="fr" onclick="FAST.setLang('fr')">FR</button>
    <button class="langbtn" data-lang="en" onclick="FAST.setLang('en')">EN</button>
    <button class="langbtn" data-lang="es" onclick="FAST.setLang('es')">ES</button>
    <button class="langbtn" data-lang="ro" onclick="FAST.setLang('ro')">RO</button>
  </div>
  
<!-- Le composant centralisé gère seul la statusbar et le menu -->
  <fast-header></fast-header>
  
  <section class="screen">
<a class="back" href="#" onclick="history.back(); return false;" data-i18n="back_generic">Retour</a>
<div class="eyebrow" data-i18n="mk_eyebrow">Marketplace</div>
<h1 data-i18n="mk_h1">Aller plus loin</h1>
<div class="card card-tap"><h3 style="font-size:14px; margin:0 0 4px;" data-i18n="mk1_title">Coach exécutive certifiée</h3><p style="font-size:12.5px; color:var(--text-dim); margin:0;" data-i18n="mk1_desc">Séances individuelles, spécialisée transitions de carrière.</p></div>
<div class="card card-tap"><h3 style="font-size:14px; margin:0 0 4px;" data-i18n="mk2_title">Association de femmes dirigeantes</h3><p style="font-size:12.5px; color:var(--text-dim); margin:0;" data-i18n="mk2_desc">Réseau et événements mensuels près de chez vous.</p></div>
<div class="card card-tap"><h3 style="font-size:14px; margin:0 0 4px;" data-i18n="mk3_title">Formation « Leadership 360° »</h3><p style="font-size:12.5px; color:var(--text-dim); margin:0;" data-i18n="mk3_desc">Un module de 6 semaines, en ligne.</p></div>
  </section>
</div>
<script src="assets/fallback.js"></script>
<script src="assets/app.js"></script>

</body>
</html>
