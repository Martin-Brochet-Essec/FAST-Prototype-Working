<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAST — Mon parcours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="device">
  <div class="langswitch">
    <button class="langbtn" data-lang="fr" onclick="FAST.setLang('fr')">FR</button>
    <button class="langbtn" data-lang="en" onclick="FAST.setLang('en')">EN</button>
    <button class="langbtn" data-lang="es" onclick="FAST.setLang('es')">ES</button>
    <button class="langbtn" data-lang="ro" onclick="FAST.setLang('ro')">RO</button>
  </div>

  <fast-header></fast-header>

  <section class="screen">
    <a class="back" href="index.html" data-i18n="back_generic">Retour</a>
    <div class="eyebrow" id="module-eyebrow">…</div>
    <h1 style="font-size:20px; margin:4px 0 12px;" id="module-titre">…</h1>

    <div class="card" id="module-chargement">
      <p style="font-size:13.5px; color:var(--text-dim); line-height:1.6; margin:0;" data-i18n="module_chargement">
        Chargement de votre parcours...
      </p>
    </div>

    <div class="card" id="module-erreur" style="display:none;">
      <p style="font-size:13.5px; color:#c0392b; line-height:1.6; margin:0;" id="module-erreur-texte"></p>
    </div>

    <!-- Étape : exercice en cours, attente du retour d'expérience -->
    <div id="module-etape-retour" style="display:none;">
      <div class="card">
        <p id="module-progression" style="font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.02em; margin:0 0 8px;"></p>
        <h3 style="font-size:14.5px; margin:0 0 6px;" id="module-jour-titre"></h3>
        <p id="module-objectif" style="font-size:13.5px; line-height:1.6; margin:0;"></p>
      </div>
      <p class="lead" data-i18n="module_retour_label">Comment ça s'est passé ?</p>
      <textarea id="module-retour-texte" rows="5" data-i18n-ph="module_retour_ph" placeholder="Racontez votre expérience..."></textarea>
      <div class="steprow">
        <button class="btn btn-primary" id="module-retour-envoyer" data-i18n="module_retour_envoyer">Envoyer mon retour</button>
      </div>
    </div>

    <!-- Étape : évaluation IA affichée, confirmation objectif atteint -->
    <div id="module-etape-confirmation" style="display:none;">
      <div class="card">
        <h3 style="font-size:13px; color:var(--rose-deep); margin:0 0 6px;" data-i18n="module_evaluation_title">Ce que votre coach en pense</h3>
        <p id="module-evaluation-texte" style="font-size:14px; color:var(--text); line-height:1.7; margin:0;"></p>
      </div>
      <p class="lead" data-i18n="module_confirmation_question">Considérez-vous avoir atteint l'objectif de cet exercice ?</p>
      <div class="steprow">
        <button class="btn btn-primary" id="module-objectif-oui" data-i18n="module_objectif_oui">Oui, exercice suivant</button>
      </div>
      <div class="steprow">
        <button class="btn btn-ghost" id="module-objectif-non" data-i18n="module_objectif_non">Pas encore, prolonger un peu</button>
      </div>
    </div>

    <!-- Étape : bilan de fin de module -->
    <div id="module-etape-bilan" style="display:none;">
      <div class="card" id="module-bilan-chargement">
        <p style="font-size:13.5px; color:var(--text-dim); line-height:1.6; margin:0;" data-i18n="module_bilan_chargement">
          Préparation du bilan de votre semaine...
        </p>
      </div>
      <div class="card" id="module-bilan-contenu" style="display:none;">
        <h3 style="font-size:13px; color:var(--rose-deep); margin:0 0 6px;" data-i18n="module_bilan_title">Votre bilan</h3>
        <p id="module-bilan-texte" style="font-size:13.5px; color:var(--text); line-height:1.7; margin:0; white-space:pre-line;"></p>
      </div>
      <p class="lead" data-i18n="module_bilan_choix_lead">Et maintenant ?</p>
      <div class="steprow">
        <button class="btn btn-primary" id="module-bilan-approfondir" data-i18n="module_bilan_approfondir">Approfondir avec mon e-Coach</button>
      </div>
      <div class="steprow">
        <button class="btn btn-ghost" id="module-bilan-mise-en-relation" data-i18n="module_bilan_mise_en_relation">Être mise en relation</button>
      </div>
    </div>
  </section>
</div>
<script src="assets/fallback.js"></script>
<script src="assets/ai-config.js"></script>
<script src="assets/ai.js"></script>
<script src="assets/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function(){
  const moduleId = new URLSearchParams(window.location.search).get('module') || 'coaching-julie';

  const chargement = document.getElementById('module-chargement');
  const erreurBloc = document.getElementById('module-erreur');
  const erreurTexte = document.getElementById('module-erreur-texte');
  const etapeRetour = document.getElementById('module-etape-retour');
  const etapeConfirmation = document.getElementById('module-etape-confirmation');
  const etapeBilan = document.getElementById('module-etape-bilan');

  let moduleDef, etat;

  function afficherErreur(erreur){
    chargement.style.display = 'none';
    etapeRetour.style.display = 'none';
    etapeConfirmation.style.display = 'none';
    etapeBilan.style.display = 'none';
    erreurBloc.style.display = 'block';
    erreurTexte.textContent = 'Error: ' + erreur.message;
  }

  function exerciceCourant(){
    return moduleDef.exercices[etat.indexExercice];
  }

  async function afficherEtapeCourante(){
    etat = FAST.getEtatModule(moduleId);

    if(etat.indexExercice >= moduleDef.exercices.length){
      await afficherBilan();
      return;
    }

    const exercice = exerciceCourant();
    const d = FAST.dict();

    if(etat.etape === 'attente_retour'){
      etapeRetour.style.display = 'block';
      etapeConfirmation.style.display = 'none';
      document.getElementById('module-progression').textContent =
        (d.module_progression_label || 'Exercice') + ' ' + (etat.indexExercice + 1) + ' / ' + moduleDef.exercices.length;
      document.getElementById('module-jour-titre').textContent = exercice.jour;
      document.getElementById('module-objectif').textContent = exercice.objectif;
      document.getElementById('module-retour-texte').value = '';

    } else if(etat.etape === 'attente_confirmation'){
      etapeRetour.style.display = 'none';
      etapeConfirmation.style.display = 'block';
      document.getElementById('module-evaluation-texte').textContent = etat.derniereEvaluation || '';
    }
  }

  async function afficherBilan(){
    etapeRetour.style.display = 'none';
    etapeConfirmation.style.display = 'none';
    etapeBilan.style.display = 'block';

    const chargementBilan = document.getElementById('module-bilan-chargement');
    const contenuBilan = document.getElementById('module-bilan-contenu');
    try{
      const bilan = await FAST.produireBilanModule(moduleId);
      chargementBilan.style.display = 'none';
      contenuBilan.style.display = 'block';
      document.getElementById('module-bilan-texte').textContent = bilan;
    }catch(erreur){
      chargementBilan.style.display = 'none';
      contenuBilan.style.display = 'block';
      document.getElementById('module-bilan-texte').textContent = 'Error: ' + erreur.message;
    }
  }

  try{
    moduleDef = await FAST.loadModule(moduleId);
    document.getElementById('module-eyebrow').textContent = FAST.dict().module_eyebrow || 'Votre parcours';
    document.getElementById('module-titre').textContent = moduleDef.name;

    FAST.demarrerOuReprendreModule(moduleId);
    chargement.style.display = 'none';
    await afficherEtapeCourante();

  }catch(erreur){
    afficherErreur(erreur);
  }

  document.getElementById('module-retour-envoyer').addEventListener('click', async function(){
    const texte = document.getElementById('module-retour-texte').value.trim();
    if(!texte) return;
    const bouton = document.getElementById('module-retour-envoyer');
    bouton.disabled = true;
    try{
      await FAST.soumettreRetourExercice(moduleId, exerciceCourant(), texte);
      await afficherEtapeCourante();
    }catch(erreur){
      afficherErreur(erreur);
    }
    bouton.disabled = false;
  });

  document.getElementById('module-objectif-oui').addEventListener('click', async function(){
    FAST.soumettreConfirmationObjectif(moduleId, exerciceCourant(), true);
    await afficherEtapeCourante();
  });

  document.getElementById('module-objectif-non').addEventListener('click', async function(){
    FAST.soumettreConfirmationObjectif(moduleId, exerciceCourant(), false);
    await afficherEtapeCourante();
  });

  document.getElementById('module-bilan-approfondir').addEventListener('click', function(){
    window.location.href = 'your-question.html';
  });
  document.getElementById('module-bilan-mise-en-relation').addEventListener('click', function(){
    window.location.href = 'marketplace.html';
  });
});
</script>
</body>
</html>
