<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAST — Email non reçu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="device">
  <div class="langswitch">
    <button class="langbtn" data-lang="fr" onclick="FAST.setLang('fr')">FR</button>
    <button class="langbtn" data-lang="en" onclick="FAST.setLang('en')">EN</button>
    <button class="langbtn" data-lang="es" onclick="FAST.setLang('es')">ES</button>
    <button class="langbtn" data-lang="ro" onclick="FAST.setLang('ro')">RO</button>
  </div>
  
<!-- Le composant centralisé gère seul la statusbar et le menu -->
  <fast-header></fast-header>
  
  <section class="screen">
<a class="back" href="#" onclick="history.back(); return false;" data-i18n="back_generic">Retour</a>
<div class="eyebrow" data-i18n="eb_eyebrow">Petit souci</div>
<h1 data-i18n="eb_h1">Redonnez-nous votre email</h1>
<p class="lead" data-i18n="eb_lead">Ça arrive — parfois le message se perd. Vérifiez l'orthographe et on renvoie tout de suite.</p>
<input type="email" id="backupEmail" data-i18n-ph="eb_ph" placeholder="Votre email">
<div class="spacer"></div>
<a class="btn btn-primary" href="email-sent.html" data-i18n="eb_cta">Renvoyer la réponse</a>
  </section>
</div>
<script src="assets/fallback.js"></script>
<script src="assets/app.js"></script>

</body>
</html>
