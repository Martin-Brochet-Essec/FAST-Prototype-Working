<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAST — Configuration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="device">
  <div class="langswitch">
    <button class="langbtn" data-lang="fr" onclick="FAST.setLang('fr')">FR</button>
    <button class="langbtn" data-lang="en" onclick="FAST.setLang('en')">EN</button>
    <button class="langbtn" data-lang="es" onclick="FAST.setLang('es')">ES</button>
    <button class="langbtn" data-lang="ro" onclick="FAST.setLang('ro')">RO</button>
  </div>
  <div class="statusbar">
  <span>9:41</span><span class="brandmark">FAST</span></div>

  <!-- Le composant centralisé gère seul la statusbar et le menu -->
  <fast-header></fast-header>

  <section class="screen">

    <div class="home-header">
  <div>
    <div class="eyebrow" data-i18n="home_eyebrow">Bonjour</div>
    <h1><span id="greetName">vous</span></h1>
<a class="back" href="#" onclick="history.back(); return false;" data-i18n="back_generic">Retour</a>
<div class="eyebrow" data-i18n="config_eyebrow">Configuration</div>
<h1 data-i18n="config_h1">Vos préférences</h1>
<p class="lead" data-i18n="config_lead">Choisissez comment et pendant combien de temps nous restons en contact.</p>
<div class="card">
  <h3 style="font-size:13px; color:var(--rose-deep); margin:0 0 10px;" data-i18n="config_freq_label">Fréquence des relances</h3>
  <div class="radio-row" id="freqGroup">
    <div class="radio-opt" data-value="daily" onclick="FAST.selectRadio(this)"><span data-i18n="config_freq_daily">Quotidienne</span></div>
    <div class="radio-opt" data-value="weekly" onclick="FAST.selectRadio(this)"><span data-i18n="config_freq_weekly">Hebdomadaire</span></div>
    <div class="radio-opt" data-value="none" onclick="FAST.selectRadio(this)"><span data-i18n="config_freq_none">Aucune relance</span></div>
  </div>
</div>
<div class="card">
  <h3 style="font-size:13px; color:var(--rose-deep); margin:0 0 10px;" data-i18n="config_retention_label">Durée de conservation de vos données</h3>
  <div class="radio-row" id="retentionGroup">
    <div class="radio-opt" data-value="3m" onclick="FAST.selectRadio(this)"><span data-i18n="config_retention_1">3 mois</span></div>
    <div class="radio-opt" data-value="1y" onclick="FAST.selectRadio(this)"><span data-i18n="config_retention_2">1 an</span></div>
    <div class="radio-opt" data-value="account" onclick="FAST.selectRadio(this)"><span data-i18n="config_retention_3">Jusqu'à suppression du compte</span></div>
  </div>
</div>
<div class="spacer"></div>
<button class="btn btn-primary" id="configSave" data-i18n="config_cta">Enregistrer</button>
  </section>
</div>
<script src="assets/fallback.js"></script>
<script src="assets/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('configSave').addEventListener('click', function(){
    var freq = document.getElementById('freqGroup').dataset.selected;
    var retention = document.getElementById('retentionGroup').dataset.selected;
    FAST.saveConfig({ reminderFrequency: freq, retention: retention });
    window.location.href = 'index.html';
  });
});
</script>
</body>
</html>
